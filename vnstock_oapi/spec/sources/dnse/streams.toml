source = "dnse"
title = "DNSE Open API stream"
url = "wss://ws-openapi.dnse.com.vn/v1/stream"
encoding = "json"
docs_url = "https://github.com/dnse-tech/openapi-sdk/tree/main/python/dnse/websocket"
checked_at = "2026-10-28"

auth = "hmac_hex"
heartbeat_s = 25
type_field = "T"
control_field = "action"

forbidden = ["order", "orders", "position", "positions", "account"]

[params]
board = ["G1", "G3", "G4", "G7", "T1", "T2", "T3", "T4", "T6"]
resolution = ["1", "3", "5", "15", "30", "1H", "1D", "1W"]
index = "^[A-Z0-9]{2,16}$"
product_group = "^[A-Z0-9]{2,8}$"

[[channels]]
name = "tick"
pattern = "tick.{board}"
symbols = true
message_types = ["t"]
description = "Khớp lệnh: giá, khối lượng, khối lượng cộng dồn"

[[channels]]
name = "tick_extra"
pattern = "tick_extra.{board}"
symbols = true
message_types = ["te"]
description = "Khớp lệnh kèm bên chủ động và giá trung bình"

[[channels]]
name = "top_price"
pattern = "top_price.{board}"
symbols = true
message_types = ["q"]
description = "Ba bước giá mua, bán"

[[channels]]
name = "expected_price"
pattern = "expected_price.{board}"
symbols = true
message_types = ["e"]
description = "Giá dự kiến ở phiên định kỳ"

[[channels]]
name = "security_definition"
pattern = "security_definition.{board}"
symbols = true
message_types = ["sd"]
description = "Giá trần, sàn, tham chiếu, trạng thái mã"

[[channels]]
name = "market_index"
pattern = "market_index.{index}"
symbols = false
message_types = ["mi"]
description = "Chỉ số trong phiên"

[[channels]]
name = "estimated_market_index"
pattern = "estimated_market_index.{index}"
symbols = false
message_types = ["emi"]
description = "Chỉ số dự kiến"

[[channels]]
name = "market_index_influence"
pattern = "market_index_influence.{index}.{resolution}"
symbols = false
message_types = ["ii"]
description = "Mức đóng góp của từng mã vào chỉ số"

[[channels]]
name = "foreign"
pattern = "foreign.{board}"
symbols = true
message_types = ["f"]
description = "Khối ngoại mua, bán, room"

[[channels]]
name = "ohlc"
pattern = "ohlc.{resolution}"
symbols = true
message_types = ["b"]
description = "Nến đang hình thành, cập nhật theo từng lệnh khớp"

[[channels]]
name = "ohlc_closed"
pattern = "ohlc_closed.{resolution}"
symbols = true
message_types = ["bc"]
description = "Nến đã đóng"

[[channels]]
name = "session"
pattern = "session.{product_group}.{board}"
symbols = false
message_types = ["s"]
description = "Chuyển phiên: ATO, liên tục, nghỉ trưa, ATC, đóng cửa"
